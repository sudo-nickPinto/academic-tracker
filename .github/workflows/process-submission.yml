name: Process submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: |
      contains(github.event.issue.labels.*.name, 'add-note') ||
      contains(github.event.issue.labels.*.name, 'add-grade') ||
      contains(github.event.issue.labels.*.name, 'add-deadline') ||
      contains(github.event.issue.labels.*.name, 'add-reminder') ||
      contains(github.event.issue.labels.*.name, 'add-announcement')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Process issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          ISSUE_STATE: ${{ github.event.issue.state }}
        run: node scripts/process-issue.js
