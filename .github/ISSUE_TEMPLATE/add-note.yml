name: Add Note
description: Add a note to a class page
title: "[Note] "
labels: ["add-note"]
body:
  - type: dropdown
    id: class_id
    attributes:
      label: Class
      options:
        - cs391
        - eng216
        - cs360
        - cs440
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "Lecture 3 — recap"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "Date (YYYY-MM-DD)"
      description: Leave blank to use today's date.
      placeholder: "2026-09-15"
    validations:
      required: false
  - type: textarea
    id: body
    attributes:
      label: "Body (Markdown supported)"
      placeholder: "Headers, lists, links, bold/italic all work."
    validations:
      required: true
