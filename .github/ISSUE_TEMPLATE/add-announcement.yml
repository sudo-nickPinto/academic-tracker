name: Add Announcement
description: Add an announcement for a class (e.g. pasted from Moodle or Outlook)
title: "[Announcement] "
labels: ["add-announcement"]
body:
  - type: dropdown
    id: class_id
    attributes:
      label: Class
      options:
        - cs391
        - eng216
        - cs360
        - cs440
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "Date (YYYY-MM-DD)"
      placeholder: "2026-09-15"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Body
    validations:
      required: true
